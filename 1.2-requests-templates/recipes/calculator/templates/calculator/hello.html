<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Главная</title>
</head>
<body>
<h1>Сервис-помощник для приготовления блюд.</h1>
Нужно отправить запрос с названием блюда и количеством порций.<br><br>
Примеры запросов: <i>/название блюда/</i> или
<i>/название блюда/?servings=количество порций</i><br><br>
Вам доступны следующие блюда:
{% for name in dishes %}
<ul>
    <li>{{ name }}</li>
</ul>
{% endfor %}
</body>
</html>
